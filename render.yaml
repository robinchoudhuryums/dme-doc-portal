# render.yaml — Render Blueprint for DME E-Sign Portal
# https://render.com/docs/blueprint-spec

databases:
  - name: dme-esign-db
    plan: free
    databaseName: dme_esign
    user: dme_user
    region: ohio

services:
  # ─── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: dme-esign-api
    runtime: node
    plan: free
    region: ohio
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && node dist/migrations/run.js && node dist/scripts/seed.js
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Database — auto-linked from the Render Postgres instance
      - key: DB_HOST
        fromDatabase:
          name: dme-esign-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dme-esign-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dme-esign-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dme-esign-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dme-esign-db
          property: password
      - key: DB_SSL
        value: "true"
      # JWT — generate a secure random secret
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_STAFF_EXPIRES
        value: 8h
      - key: JWT_PHYSICIAN_EXPIRES
        value: 1h
      # AWS S3 — set these manually after deploying
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Signing links — update SIGNING_BASE_URL after first deploy
      - key: SIGNING_BASE_URL
        sync: false
      - key: SIGNING_LINK_EXPIRY_DAYS
        value: "30"
      - key: MAX_PIN_ATTEMPTS
        value: "5"
      # SMTP — set these manually
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@universalmedicalsupply.com
      # Fax — set provider credentials manually
      - key: FAX_PROVIDER
        value: twilio
      # CORS — update after first deploy to match the static site URL
      - key: CORS_ORIGIN
        sync: false
      # HIPAA
      - key: SESSION_TIMEOUT_MINUTES
        value: "15"

  # ─── Frontend (Static Site) ──────────────────────────────────────────────
  - type: web
    name: dme-esign-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your API service URL (e.g. https://dme-esign-api.onrender.com)
      - key: VITE_API_URL
        sync: false
